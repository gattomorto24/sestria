name: Verifica Sestria
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Installa Godot ufficiale
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Importa risorse
        working-directory: mobile
        run: Godot_v4.7.1-stable_linux.x86_64 --headless --editor --import --quit
      - name: Regole, progressione, aggiornamenti e LAN
        working-directory: mobile
        run: |
          mkdir -p build/android
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/rules_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/stats_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/progression_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/updater_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/lan_lifecycle_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --fixed-fps 120 --script res://tests/lan_test.gd -- --lan-favors
          Godot_v4.7.1-stable_linux.x86_64 --headless --fixed-fps 60 --script res://tests/scroll_test.gd
      - name: Importa e verifica l’edizione desktop
        run: |
          mkdir -p build/android
          Godot_v4.7.1-stable_linux.x86_64 --headless --editor --import --quit
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/rules_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/stats_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/progression_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --script res://tests/desktop_updater_test.gd
          Godot_v4.7.1-stable_linux.x86_64 --headless --fixed-fps 120 --script res://tests/lan_test.gd -- --lan-favors
          Godot_v4.7.1-stable_linux.x86_64 --headless --fixed-fps 120 -- --sestria-test --difficulty-1
