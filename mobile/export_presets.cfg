[preset.0]

name="Android Mobile Saga"
platform="Android"
runnable=true
dedicated_server=false
custom_features="portrait"
export_filter="all_resources"
include_filter=""
exclude_filter="build/*,tests/*,tools/*,android/*,native/*,README.md"
export_path="./build/android/Sestria-v4.8-Android.apk"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/compress_native_libraries=true
gradle_build/gradle_build_directory="res://android"
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=48
version/name="4.8"
package/unique_name="com.orlog.valhalla.portrait"
package/name="Sestria"
package/signed=true
package/retain_data_on_uninstall=false
launcher_icons/main_192x192="res://assets/icons/app_icon.svg"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/app_icon.svg"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
permissions/change_wifi_multicast_state=true

screen/edge_to_edge=true
permissions/vibrate=true
splash_screen/icon="res://assets/ui/mobile_splash.png"
splash_screen/disable_godot_boot_splash=false

